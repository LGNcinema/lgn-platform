services:
  db:
    image: postgres:15-alpine
    container_name: lgn_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lgn_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lgn_backend
    restart: always
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/lgn_platform
      - ENV=development
      # Live Geme prompt tuning. Local development only -- it lets a client
      # replace Geme's system prompt, so it must stay off in any deployment.
      - GEME_DEBUG=true
      # ANTHROPIC_API_KEY (for Geme) and ADMIN_PASSWORD / ADMIN_SECRET (for the
      # admin portal) both come from backend/.env -- see env_file below.
      # Don't list them here: anything under `environment:` wins over env_file, so
      # naming them would blank out the value whenever the host shell doesn't set
      # it. With ADMIN_PASSWORD unset the admin API fails closed with 503 on every
      # request rather than running unauthenticated -- see backend/.env.example.
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - db
    # Same file the bare-metal `uv run uvicorn` reads, so the Anthropic key for
    # Geme lives in one place either way. Values under `environment:` above still
    # win, so DATABASE_URL stays pointed at the postgres service.
    env_file:
      - path: ./backend/.env
        required: false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lgn_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
