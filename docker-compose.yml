services:
  db:
    image: postgres:15-alpine
    container_name: lgn_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lgn_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lgn_backend
    restart: always
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/lgn_platform
      - ENV=development
      # Admin portal password. Compose reads a .env in the project root, so set
      # ADMIN_PASSWORD there to override the local-dev default below. Never use
      # the default anywhere but localhost. If this is unset the admin API
      # refuses every request with 503 rather than running unauthenticated.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-lgn-dev-admin}
      - ADMIN_SECRET=${ADMIN_SECRET:-}
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lgn_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
