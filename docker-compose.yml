services:
  db:
    image: postgres:15-alpine
    container_name: lgn_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lgn_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lgn_backend
    restart: always
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/lgn_platform
      - ENV=development
      # ANTHROPIC_API_KEY (for Geme) comes from backend/.env -- see env_file below.
      # Don't list it here: anything under `environment:` wins over env_file, so
      # naming it would blank out the key whenever the host shell doesn't set it.
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - db
    # Same file the bare-metal `uv run uvicorn` reads, so the Anthropic key for
    # Geme lives in one place either way. Values under `environment:` above still
    # win, so DATABASE_URL stays pointed at the postgres service.
    env_file:
      - path: ./backend/.env
        required: false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lgn_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
