[project]
name = "lgn-backend"
version = "0.1.0"
description = "FastAPI backend for Cinema Production Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.2.1",
    "pydantic>=2.6.4",
]

[tool.uv]
dev-dependencies = [
    "black>=24.2.0",
    "isort>=5.13.2",
    "pytest>=8.0.2",
]
