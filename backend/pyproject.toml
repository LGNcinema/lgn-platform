[project]
name = "lgn-backend"
version = "0.1.0"
description = "FastAPI backend for Cinema Production Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.2.1",
    "pydantic>=2.6.4",
    "anthropic>=1.0.0",
]

[dependency-groups]
dev = [
    "black>=24.2.0",
    "isort>=5.13.2",
    "pytest>=8.0.2",
]

[tool.uv]
# This project is a bare `app/` package run by uvicorn, not an installable
# distribution -- there is no [build-system] and nothing to build. Vercel runs
# `uv sync` during the build, which would otherwise try to install the project
# itself and fail. (The Dockerfile passes `--no-install-project` for the same
# reason; this makes it the default everywhere.)
package = false
